<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Astoria Waterfront Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}#map{width:100%}.bar{position:absolute;z-index:1000;top:10px;left:48px;right:10px;display:flex;gap:6px}.bar button{border:1px solid #777;border-radius:8px;background:#fff;padding:8px 10px;font:13px -apple-system,sans-serif}.bar button.on{font-weight:700}.leaflet-tooltip{font-size:11px;font-weight:600}</style></head><body><div id="map"></div><div class="bar"><button id="home">Waterfront view</button><button id="add">Add note</button><button id="clear">Clear added</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>var m=L.map('map',{zoomSnap:.25}).setView([40.766,-73.94],14.25);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);var base=[['Power plant',40.75917,-73.94611],['Rainey Park',40.7663,-73.9407],['Costco waterfront',40.76715,-73.93965],['Socrates Sculpture Park',40.768347,-73.9365455],['Hallets Cove',40.76925,-73.9357],['Space Time',40.77005,-73.93555],['Astoria Ferry',40.7717,-73.9357],['Astoria Park',40.77944,-73.92194]];base.forEach(function(x){L.circleMarker([x[1],x[2]],{radius:5,color:'#222',fillColor:'#f0a000',fillOpacity:.9}).addTo(m).bindTooltip(x[0],{permanent:true,direction:'top'});});var key='astoria-waterfront-notes';var notes=[];try{notes=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}var layer=L.layerGroup().addTo(m);function draw(){layer.clearLayers();notes.forEach(function(n){var q=L.circleMarker([n.lat,n.lng],{radius:6,color:'#222',fillColor:'#2878d0',fillOpacity:.9}).addTo(layer).bindTooltip(n.text,{permanent:true,direction:'top'});q.on('click',function(){var v=prompt('Edit note. Leave blank to delete:',n.text);if(v===null)return;if(v.trim())n.text=v.trim();else notes=notes.filter(function(z){return z.id!==n.id});localStorage.setItem(key,JSON.stringify(notes));draw();});});}draw();var adding=false;var b=document.getElementById('add');b.onclick=function(){adding=!adding;b.classList.toggle('on',adding);b.textContent=adding?'Tap map...':'Add note'};m.on('click',function(e){if(!adding)return;var t=prompt('Note text:');if(t&&t.trim()){notes.push({id:Date.now(),lat:e.latlng.lat,lng:e.latlng.lng,text:t.trim()});localStorage.setItem(key,JSON.stringify(notes));draw();}adding=false;b.classList.remove('on');b.textContent='Add note'});document.getElementById('home').onclick=function(){m.setView([40.766,-73.94],14.25)};document.getElementById('clear').onclick=function(){if(confirm('Clear only the notes you added on this phone?')){notes=[];localStorage.removeItem(key);draw();}};</script></body></html>
