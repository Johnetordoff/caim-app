<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Astoria Waterfront Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}#map{width:100%}.title{position:absolute;z-index:1000;top:10px;left:50px;background:white;padding:6px 8px;border-radius:6px;font:13px -apple-system,sans-serif}</style></head><body><div id="map"></div><div class="title">Astoria waterfront - west of 21st Street</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>var m=L.map('map').setView([40.766,-73.94],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);[['Power plant',40.75917,-73.94611],['Rainey Park',40.7663,-73.9407],['Costco waterfront',40.76715,-73.93965],['Socrates Sculpture Park',40.768347,-73.9365455],['Hallets Cove',40.76925,-73.9357],['Space Time',40.77005,-73.93555],['Astoria Ferry',40.7717,-73.9357],['Astoria Park',40.77944,-73.92194]].forEach(function(x){L.marker([x[1],x[2]]).addTo(m).bindTooltip(x[0],{permanent:true,direction:'top'});});</script></body></html>
