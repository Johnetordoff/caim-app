<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>RETRO DRIFT // SAFARI FIDELITY</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020407;color:#f4b95f;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none}canvas{display:block;width:100%;height:100%}.seg{position:fixed;border:1px solid #66491e;background:#070906d9;box-shadow:inset 0 0 12px #000,0 0 8px #5b351b55;padding:5px 8px;letter-spacing:.14em;text-shadow:0 0 7px currentColor;font-size:11px;z-index:5}.seg b{font-size:18px;font-weight:500}.speed{top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));pointer-events:none}.mode{top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));pointer-events:auto}.status{top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);pointer-events:none;text-align:center}.mode button,.tilt button{font:inherit;color:inherit;background:#080b08;border:1px solid #66491e;padding:6px}.tilt{top:56px;right:max(8px,env(safe-area-inset-right));pointer-events:auto}.hint{bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none}.pedal{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));width:min(25vw,110px);height:min(25vw,110px);border:1px solid #66491e;background:#07090655;color:#f4b95f;font:12px ui-monospace,monospace;letter-spacing:.12em;z-index:6}.brake{left:max(10px,env(safe-area-inset-left))}.gas{right:max(10px,env(safe-area-inset-right))}.boot{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;text-align:center;max-width:min(80vw,520px)}.boot.err{color:#ff9f7d;border-color:#8a3d2b}.hidden{display:none}@media(pointer:fine){.pedal,.tilt{display:none}}@media(max-width:500px) and (orientation:portrait){.hint{bottom:130px}.seg b{font-size:15px}.status{top:62px}.tilt{top:108px}}
</style>
</head>
<body>
<div class="seg speed">SPD <b id="spd">000</b><br>GEAR <b id="gear">1</b></div>
<div class="seg status" id="status">SAFARI // STARTING</div>
<div class="seg mode"><button id="look">SOURCE</button></div>
<div class="seg tilt" id="tiltWrap"><button id="tiltEnable">ENABLE TILT</button></div>
<div class="seg hint">TILT / ← → · GAS ↑ · BRAKE ↓ · GAS+BRAKE+TURN = DRIFT</div>
<button class="pedal brake" id="brake">BRAKE</button>
<button class="pedal gas" id="gas">GAS</button>
<div class="seg boot" id="boot">INITIALIZING SAFARI WEBGPU</div>
<script type="module">
const boot=document.getElementById('boot');
const status=document.getElementById('status');
if(!window.isSecureContext){boot.classList.add('err');boot.textContent='HTTPS REQUIRED // OPEN AS A REAL SAFARI WEBPAGE';throw new Error('Retro Drift WebGPU demo requires a secure HTTPS context.');}
let THREE;
try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js');}
catch(error){boot.classList.add('err');boot.textContent='3D MODULE BLOCKED // THIS IS NOT A NORMAL SAFARI PAGE';status.textContent='MODULE LOAD FAILED';throw error;}
const usingWebGPU=!!navigator.gpu;
status.textContent=usingWebGPU?'SAFARI // WEBGPU':'SAFARI // WEBGL2 FALLBACK';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02050a);scene.fog=new THREE.FogExp2(0x07101a,.018);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,260);camera.position.set(0,3.2,7.5);
const renderer=new THREE.WebGPURenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.body.prepend(renderer.domElement);
try{await renderer.init();boot.classList.add('hidden');}catch(error){boot.classList.add('err');boot.textContent='GPU INIT FAILED // '+(usingWebGPU?'WEBGPU':'WEBGL2');status.textContent='GPU INIT FAILED';throw error;}
const roadMat=new THREE.MeshPhysicalMaterial({color:0x11151a,roughness:.36,metalness:.2,clearcoat:.18,clearcoatRoughness:.35});const road=new THREE.Mesh(new THREE.PlaneGeometry(18,420),roadMat);road.rotation.x=-Math.PI/2;road.position.z=-175;road.receiveShadow=true;scene.add(road);
const shoulderMat=new THREE.MeshStandardMaterial({color:0x202226,roughness:.9});for(const x of[-9.4,9.4]){const s=new THREE.Mesh(new THREE.BoxGeometry(.8,.22,420),shoulderMat);s.position.set(x,.1,-175);s.receiveShadow=true;scene.add(s)}
const car=new THREE.Group();scene.add(car);car.position.y=.48;
const paint=new THREE.MeshPhysicalMaterial({color:0x164d73,metalness:.62,roughness:.2,clearcoat:.8,clearcoatRoughness:.15});const dark=new THREE.MeshStandardMaterial({color:0x08090a,roughness:.3,metalness:.35});const glass=new THREE.MeshPhysicalMaterial({color:0x07131c,roughness:.1,metalness:.12,transmission:.2,transparent:true,opacity:.74});
function box(w,h,d,m,x,y,z,rx=0){const q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d,2,1,3),m);q.position.set(x,y,z);q.rotation.x=rx;q.castShadow=q.receiveShadow=true;car.add(q);return q}
box(2.25,.48,4.25,paint,0,.42,0);box(2.08,.3,1.45,paint,0,.7,-1.2,-.06);box(1.75,.72,1.75,glass,0,.92,.25);box(1.62,.14,1.48,paint,0,1.3,.3);box(2.2,.18,.2,dark,0,.28,2.05);box(2.2,.18,.2,dark,0,.28,-2.05);
const wheelGeo=new THREE.CylinderGeometry(.42,.42,.28,16);for(const x of[-1.1,1.1])for(const z of[-1.35,1.35]){const w=new THREE.Mesh(wheelGeo,dark);w.rotation.z=Math.PI/2;w.position.set(x,.35,z);w.castShadow=true;car.add(w)}
const red=new THREE.MeshStandardMaterial({color:0x660000,emissive:0xff1208,emissiveIntensity:5});const warm=new THREE.MeshStandardMaterial({color:0xe8d9b2,emissive:0xffe3ad,emissiveIntensity:4});for(const x of[-.72,.72]){box(.55,.18,.06,red,x,.58,2.14);box(.48,.16,.06,warm,x,.56,-2.14);const h=new THREE.SpotLight(x<0?0xffdfaa:0xffe8bf,90,48,Math.PI/7,.6,1.35);h.position.set(x,.58,-2.1);h.target.position.set(x*.45,0,-32);car.add(h,h.target)}
const moon=new THREE.DirectionalLight(0x7696c8,2.2);moon.position.set(-8,14,8);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);scene.add(moon);scene.add(new THREE.HemisphereLight(0x304b70,0x080606,.8));
for(let z=10;z>-300;z-=30)for(const x of[-7.3,7.3]){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.05,.07,5,6),dark);pole.position.set(x,2.5,z);scene.add(pole);const l=new THREE.PointLight(z%60===10?0xffc56b:0x8db8ff,22,20,2);l.position.set(x,4.8,z);scene.add(l);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.11,8,6),new THREE.MeshBasicMaterial({color:l.color}));bulb.position.copy(l.position);scene.add(bulb)}
const keys={};addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);let gas=false,brake=false,tilt=0,speed=22,yaw=0,retro=false;
function hold(id,set){const e=document.getElementById(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();try{e.setPointerCapture(ev.pointerId)}catch{}set(true)});for(const a of['pointerup','pointercancel'])e.addEventListener(a,()=>set(false))}hold('gas',v=>gas=v);hold('brake',v=>brake=v);
function onOrientation(e){if(e.gamma!=null)tilt=THREE.MathUtils.clamp(e.gamma/28,-1,1)}
const tiltWrap=document.getElementById('tiltWrap'),tiltEnable=document.getElementById('tiltEnable');
if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){tiltEnable.onclick=async()=>{try{const r=await DeviceOrientationEvent.requestPermission();if(r==='granted'){addEventListener('deviceorientation',onOrientation);tiltEnable.textContent='TILT ON'}else tiltEnable.textContent='TILT DENIED'}catch{tiltEnable.textContent='TILT ERROR'}}}else{addEventListener('deviceorientation',onOrientation);tiltWrap.classList.add('hidden')}
document.getElementById('look').onclick=()=>{retro=!retro;document.getElementById('look').textContent=retro?'RETRO':'SOURCE';renderer.setPixelRatio(retro?Math.min(devicePixelRatio,.72):Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight)};
let last=performance.now();function tick(t){const dt=Math.min(.04,(t-last)/1000);last=t;const throttle=gas||keys.ArrowUp?1:0,stop=brake||keys.ArrowDown?1:0;let steer=(keys.ArrowLeft?-1:0)+(keys.ArrowRight?1:0)+(matchMedia('(pointer:coarse)').matches?tilt:0);steer=THREE.MathUtils.clamp(steer,-1,1);const drift=keys.Shift||(throttle&&stop&&Math.abs(steer)>.2);speed+=throttle*18*dt-stop*28*dt-speed*.035*dt;speed=THREE.MathUtils.clamp(speed,4,48);yaw+=steer*(drift?1.8:.7)*dt*(.35+speed/48);car.rotation.y=yaw;car.position.x+=Math.sin(yaw)*speed*dt*.17;car.position.z-=Math.cos(yaw)*speed*dt*.17;car.position.x=THREE.MathUtils.clamp(car.position.x,-8.3,8.3);camera.position.lerp(new THREE.Vector3(car.position.x-Math.sin(yaw)*6.8,3.25,car.position.z+Math.cos(yaw)*6.8),.08);camera.lookAt(car.position.x,car.position.y+.35,car.position.z-Math.cos(yaw)*5);document.getElementById('spd').textContent=String(Math.round(speed*4.1)).padStart(3,'0');document.getElementById('gear').textContent=Math.min(5,Math.max(1,Math.ceil(speed/10)));renderer.render(scene,camera);requestAnimationFrame(tick)}requestAnimationFrame(tick);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=innerHeight>innerWidth?68:58;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
