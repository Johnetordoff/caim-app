<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Retro Drifter</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060b;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none;-webkit-user-select:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#05060b}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:2px 2px 0 #000;letter-spacing:.08em}.brand{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));font-weight:900;font-size:18px;letter-spacing:.18em}.brand small{display:block;font-size:9px;opacity:.62;margin-top:4px}.speed{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));text-align:right;font-size:10px}.speed b{display:block;font-size:30px;line-height:.9}.track{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));font-size:10px;opacity:.78}.score{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));text-align:right;font-size:10px}.scan{position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.08),rgba(255,255,255,.08) 1px,transparent 1px,transparent 3px)}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.62) 100%)}#controls{position:fixed;inset:0;pointer-events:none;display:none}.cluster{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:10px;pointer-events:auto}.left{left:max(12px,env(safe-area-inset-left))}.right{right:max(12px,env(safe-area-inset-right));align-items:flex-end}.btn{width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.38);background:rgba(8,10,18,.64);color:#fff;font:800 11px/1 ui-monospace,monospace;letter-spacing:.05em;box-shadow:inset 0 0 18px rgba(120,140,255,.10),0 2px 12px rgba(0,0,0,.4);touch-action:none}.btn.big{width:74px;height:74px}.btn.on{background:rgba(94,72,150,.85);transform:scale(.96)}#intro{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);z-index:20;padding:20px}.card{border:1px solid rgba(255,255,255,.35);background:rgba(4,6,12,.78);padding:20px 22px;text-align:center;max-width:520px;box-shadow:0 0 35px rgba(105,120,255,.13)}.card h1{margin:0 0 8px;font-size:30px;letter-spacing:.18em}.card p{font-size:11px;line-height:1.5;opacity:.8}.start{margin-top:10px;min-width:180px;min-height:48px;border:1px solid rgba(255,255,255,.65);border-radius:4px;background:#171a27;color:#fff;font:800 13px ui-monospace,monospace;letter-spacing:.12em}.hide{display:none!important}@media(pointer:coarse),(max-width:900px){#controls{display:block}.track,.score{bottom:96px}.brand{font-size:14px}.speed b{font-size:25px}#intro{display:none}.card .keys{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="brand">RETRO DRIFTER<small>BAYLINE // MIDNIGHT HARBOR</small></div><div class="speed"><b id="spd">000</b>KM/H</div><div class="track">RUN 01 // LOST 1999 BUILD</div><div class="score">DRIFT <span id="score">000000</span><br><span id="gear">GEAR 1</span></div></div>
<div class="scan"></div><div class="vignette"></div>
<div id="controls"><div class="cluster left"><button class="btn big" data-k="left">◀</button><button class="btn big" data-k="right">▶</button></div><div class="cluster right"><button class="btn" data-k="drift">DRIFT</button><button class="btn" data-k="brake">BRAKE</button><button class="btn big" data-k="gas">GAS</button></div></div>
<div id="intro"><div class="card"><h1>RETRO DRIFTER</h1><p>Browser-native night racer demo. Plain-canvas fallback so it runs reliably on phone and desktop.</p><p class="keys">W / ↑ gas &nbsp; S / ↓ brake &nbsp; A D / ← → steer &nbsp; SPACE drift</p><button class="start" id="start">START BAYLINE</button></div></div>
<script>
(()=>{'use strict';
const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});
const mobile=matchMedia('(pointer:coarse)').matches||/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
let W=0,H=0,D=1,started=mobile,t=0,speed=0,carX=0,steer=0,drift=0,score=0;
const key={gas:false,brake:false,left:false,right:false,drift:false};
function resize(){D=Math.min(devicePixelRatio||1,2);W=Math.max(320,innerWidth);H=Math.max(180,innerHeight);c.width=Math.floor(W*D);c.height=Math.floor(H*D);c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,80));resize();
function curve(z){return Math.sin((z+t*.85)/220)*.78+Math.sin((z+t*.45)/93)*.24}
function hill(z){return Math.sin((z+t*.42)/175)*18+Math.sin((z+t*.27)/71)*6}
function project(z){const horizon=H*.36;const p=1/(z*.0035+.18);return {y:horizon+(H-horizon)*p*.22,w:Math.min(W*1.1,W*.028*p*34),p}}
function poly(a,b,c,d,fill){x.fillStyle=fill;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.lineTo(c.x,c.y);x.lineTo(d.x,d.y);x.closePath();x.fill()}
function road(){x.fillStyle='#070914';x.fillRect(0,0,W,H);const hz=H*.36;const sky=x.createLinearGradient(0,0,0,hz);sky.addColorStop(0,'#02030a');sky.addColorStop(1,'#15152a');x.fillStyle=sky;x.fillRect(0,0,W,hz+1);
for(let i=0;i<35;i++){const sx=(i*97+(i%5)*41)%W,sy=(i*53)%Math.max(1,hz-10);x.fillStyle=i%4?'rgba(215,225,255,.28)':'rgba(170,150,255,.42)';x.fillRect(sx,sy,1,1)}
x.fillStyle='#11111d';x.fillRect(0,hz,W,H-hz);
const segs=[];for(let i=70;i>=1;i--){const z=i*18;const q=project(z),center=W*.5+curve(z)*W*.22+carX*q.p*.012;const y=q.y+hill(z)*q.p*.025;segs.push({z,q,c:center,y})}
segs.push({z:0,q:{w:W*.66,p:6},c:W*.5+carX*2.8,y:H*1.03});
for(let i=0;i<segs.length-1;i++){const a=segs[i],b=segs[i+1],flash=((Math.floor((a.z+t*4)/36)&1)===0);const aw=a.q.w,bw=b.q.w;poly({x:a.c-aw*1.24,y:a.y},{x:a.c-aw,y:a.y},{x:b.c-bw,y:b.y},{x:b.c-bw*1.24,y:b.y},flash?'#291b2b':'#17151d');poly({x:a.c-aw,y:a.y},{x:a.c+aw,y:a.y},{x:b.c+bw,y:b.y},{x:b.c-bw,y:b.y},flash?'#171821':'#11121a');poly({x:a.c+aw,y:a.y},{x:a.c+aw*1.24,y:a.y},{x:b.c+bw*1.24,y:b.y},{x:b.c+bw,y:b.y},flash?'#291b2b':'#17151d');if(i%4===0){const lw=Math.max(1,a.q.p*.35),bw2=Math.max(1,b.q.p*.35);poly({x:a.c-lw,y:a.y},{x:a.c+lw,y:a.y},{x:b.c+bw2,y:b.y},{x:b.c-bw2,y:b.y},'rgba(205,205,220,.42)')}}
for(let i=1;i<segs.length-3;i+=5){const s=segs[i],p=s.q.p,side=((i/5|0)%2?1:-1),bx=s.c+side*s.q.w*(1.8+(i%3)*.45),base=s.y,bh=Math.min(H*.34,8*p+(i%4)*8);x.fillStyle=(i%3===0)?'#181527':'#12131b';x.fillRect(bx-5*p,base-bh,10*p,bh);if(i%2===0){x.fillStyle='rgba(130,110,255,.35)';x.fillRect(bx-2*p,base-bh+4*p,1.4*p,1.4*p)}}
}
function car(){const y=H*.76,w=Math.min(170,W*.18),h=w*.44,lean=steer*8+drift*11;x.save();x.translate(W*.5+carX,y);x.rotate(lean*Math.PI/180*.18);x.fillStyle='rgba(0,0,0,.55)';x.beginPath();x.ellipse(0,h*.43,w*.58,h*.22,0,0,Math.PI*2);x.fill();x.fillStyle='#5e0f22';x.beginPath();x.moveTo(-w*.55,h*.32);x.lineTo(-w*.44,-h*.17);x.lineTo(-w*.24,-h*.42);x.lineTo(w*.27,-h*.4);x.lineTo(w*.51,-h*.12);x.lineTo(w*.58,h*.31);x.closePath();x.fill();x.fillStyle='#8f1730';x.beginPath();x.moveTo(-w*.42,-h*.12);x.lineTo(-w*.2,-h*.36);x.lineTo(w*.23,-h*.34);x.lineTo(w*.43,-h*.09);x.closePath();x.fill();x.fillStyle='#151a27';x.beginPath();x.moveTo(-w*.18,-h*.3);x.lineTo(w*.19,-h*.29);x.lineTo(w*.32,-h*.1);x.lineTo(-w*.31,-h*.1);x.closePath();x.fill();x.fillStyle='#ff355d';x.fillRect(-w*.42,h*.12,w*.16,h*.08);x.fillRect(w*.26,h*.12,w*.16,h*.08);x.fillStyle='#07080c';x.fillRect(-w*.58,h*.2,w*.15,h*.22);x.fillRect(w*.43,h*.2,w*.15,h*.22);x.fillStyle='rgba(230,230,255,.13)';x.fillRect(-w*.3,-h*.08,w*.6,h*.04);x.restore()}
function input(dt){const dir=(key.right?1:0)-(key.left?1:0);if(started){if(key.gas)speed+=85*dt;else speed-=22*dt;if(key.brake)speed-=110*dt;speed=Math.max(0,Math.min(255,speed));steer+=(dir-steer)*Math.min(1,7*dt);drift+=((key.drift?1:0)-drift)*Math.min(1,6*dt);carX+=dir*(90+speed*.36)*dt*(key.drift?1.55:1);carX*=Math.pow(.91,dt*60);carX=Math.max(-W*.23,Math.min(W*.23,carX));if(key.drift&&speed>70&&dir){score+=Math.abs(dir)*speed*dt*1.35}}}
let last=performance.now();function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;input(dt);t+=speed*dt*.19;road();car();document.getElementById('spd').textContent=String(Math.round(speed)).padStart(3,'0');document.getElementById('score').textContent=String(Math.floor(score)).padStart(6,'0');document.getElementById('gear').textContent='GEAR '+Math.min(5,Math.max(1,Math.floor(speed/52)+1))+(key.drift?' // DRIFT':'');requestAnimationFrame(frame)}requestAnimationFrame(frame);
function set(n,v){key[n]=v;if(v)started=true}
addEventListener('keydown',e=>{const m={ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'drift'}[e.code];if(m){e.preventDefault();set(m,true);document.getElementById('intro').classList.add('hide')}});addEventListener('keyup',e=>{const m={ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'drift'}[e.code];if(m)set(m,false)});
for(const b of document.querySelectorAll('.btn')){const n=b.dataset.k,go=v=>{set(n,v);b.classList.toggle('on',v)};b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){ }go(true)});b.addEventListener('pointerup',e=>{e.preventDefault();go(false)});b.addEventListener('pointercancel',()=>go(false));b.addEventListener('lostpointercapture',()=>go(false))}
document.getElementById('start').onclick=()=>{started=true;document.getElementById('intro').classList.add('hide')};if(mobile)document.getElementById('intro').classList.add('hide');
})();
</script>
</body>
</html>
