<body>

<div id="overlay">
 <div class="top"><div><div class="logo">RETRO <em>DRIFT</em></div><div class="subtitle">AFTERIMAGE // CHROMATIC DUEL 05</div></div><div class="duel">NEON RUN / 01<div class="gap" id="gap">RIVAL +082M</div></div></div>

<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false}),$=id=>document.getElementById(id);
if(!ctx){$('hint').textContent='Canvas graphics unavailable in this browser';return;}
let w=1280,h=720,dpr=1,portrait=false,compact=false,lowFX=false,last=0,clock=0,nowAudio=0,beats=0,finished=false,flashAge=0;
const player={s:50,v:220,x:0,vx:0,slip:0,score:0,drifting:false,steer:0};
let rival={s:135,v:254,x:1.1},traffic=[],sparks=[],trails=[],nearMiss=new Set(),panelBeat=0;
const key={},touch={left:0,right:0,gas:0,brake:0,slide:0};
let audio=null,master=null,engine=null,nextStep=0,stepNo=0,audioStart=0;
let skyCache=null,cityLayers=[];
const PI=Math.PI,TAU=PI*2,clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const fract=x=>x-Math.floor(x),rnd=n=>fract(Math.sin(n*127.169+78.137)*43758.5453),lerp=(a,b,t)=>a+(b-a)*t;
function resize(){w=innerWidth||1280;h=innerHeight||720;portrait=h>w*1.16;compact=h<470;dpr=Math.min(devicePixelRatio||1,lowFX?1:1.5);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);skyCache=null;cityLayers=[]}
window.addEventListener('resize',resize);resize();
function reset(){Object.assign(player,{s:50,v:220,x:0,vx:0,slip:0,score:0,drifting:false,steer:0});rival={s:133,v:254,x:1.1};traffic=[{s:280,x:-5.0,v:130,id:1},{s:495,x:5.1,v:147,id:2},{s:740,x:.4,v:154,id:3}];sparks=[];trails=[];nearMiss.clear();clock=0;finished=false;flashAge=0;$('result').style.display='none';$('hint').style.opacity='1';}reset();
function controls(){let steer=(key.ArrowRight||key.KeyD||touch.right?1:0)-(key.ArrowLeft||key.KeyA||touch.left?1:0);return{steer,gas:!!(key.ArrowUp||key.KeyW||touch.gas),brake:!!(key.ArrowDown||key.KeyS||touch.brake),drift:!!(key.ShiftLeft||key.ShiftRight||key.Space||touch.slide)}}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();key[e.code]=1;if(e.code==='KeyR'&&!e.repeat)reset()});window.addEventListener('keyup',e=>key[e.code]=0);window.addEventListener('blur',()=>{for(const k in key)key[k]=0;for(const k in touch)touch[k]=0});
for(const [id,k] of [['left','left'],['right','right'],['gas','gas'],['brake','brake'],['slide','slide']]){const el=$(id),off=()=>{touch[k]=0;el.classList.remove('pressed')};el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}touch[k]=1;el.classList.add('pressed')});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,off)}
$('restart').onclick=reset;$('again').onclick=reset;$('quality').onclick=()=>{lowFX=!lowFX;$('quality').textContent=lowFX?'FX LOW':'FX HIGH';resize()};
function buzz(text){$('flash').textContent=text;$('flash').classList.add('on');flashAge=.58}
const note=(t,type,f,vol,dur,fall=1)=>{if(!audio)return;const osc=audio.createOscillator(),g=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(f,t);osc.frequency.exponentialRampToValueAtTime(Math.max(30,f*fall),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);osc.connect(g).connect(master);osc.start(t);osc.stop(t+dur+.01)};
const hat=(t,vol)=>{if(!audio)return;const samples=1800,b=audio.createBuffer(1,samples,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<samples;i++)d[i]=Math.random()*2-1;const src=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();src.buffer=b;f.type='highpass';f.frequency.value=5100;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+.055);src.connect(f).connect(g).connect(master);src.start(t);src.stop(t+.057)};
function playStep(n,t){const m=n%16;if([0,3,7,10,14].includes(m))note(t,'sine',m===0?130:100,.12,.18,.31);if([4,12].includes(m)){note(t,'triangle',225,.045,.1,.39);hat(t,.08)}if([2,5,6,8,11,13,15].includes(m))hat(t,m===11?.09:.04);if([0,3,6,10,12,15].includes(m)){let f=[55,65.4,73.4,82.4,98,110][[0,3,6,10,12,15].indexOf(m)];note(t,'sawtooth',f,.025,.20,.72)} }
$('sound').onclick=async()=>{if(audio){await audio.close();audio=engine=master=null;$('sound').textContent='♫ SOUND OFF';return;}try{const AC=window.AudioContext||window.webkitAudioContext;audio=new AC();await audio.resume();master=audio.createGain();master.gain.value=.65;master.connect(audio.destination);engine=audio.createOscillator();const f=audio.createBiquadFilter(),g=audio.createGain();engine.type='sawtooth';f.type='lowpass';f.frequency.value=240;g.gain.value=.013;engine.connect(f).connect(g).connect(master);engine.start();engine._gain=g;nextStep=audio.currentTime+.03;stepNo=0;audioStart=nextStep;$('sound').textContent='♫ SOUND ON'}catch(e){console.warn('Audio unavailable',e);audio=null;}}
function updateAudio(){if(!audio)return;const t=audio.currentTime;if(engine){engine.frequency.setTargetAtTime(55+player.v*.68+(player.drifting?28:0),t,.05);engine._gain.gain.setTargetAtTime(.007+player.v*.000025+(player.drifting?.003:0),t,.06)}let n=0;while(nextStep<t+.10&&n++<6){playStep(stepNo++,nextStep);nextStep+=60/132/4;}if(nextStep<t-.5)nextStep=t}
function road(s){return Math.sin(s*.0037)*25+Math.sin(s*.0105)*11+Math.sin(s*.0012+2)*31}
function update(dt){if(finished)return;clock+=dt;const c=controls();player.steer+=(c.steer-player.steer)*Math.min(1,dt*15);let drift=(c.drift||(c.gas&&c.brake))&&player.v>60;player.drifting=drift;
const gas=c.gas?245:0,auto=player.v<244?120:player.v<270?60:0,drag=20+player.v*.075;const breaking=c.brake?(c.gas?95:340):0;
player.v=clamp(player.v+(gas+auto-drag-breaking)*dt,60,402);
const vsc=clamp(player.v/250,.45,1.28),aim=player.steer*(drift?13.5:10.4)*vsc;
player.vx+=(aim-player.vx)*(1-Math.exp(-(drift?3.8:15)*dt));if(!drift&&!c.steer)player.vx*=Math.exp(-5*dt);
player.x+=player.vx*dt;const max=8.25;if(Math.abs(player.x)>max){player.x=clamp(player.x,-max,max);player.vx*=-.14;player.v*=1-dt*.5}
const ang=drift?clamp(-player.steer*.36-player.vx*.032,-.72,.72):clamp(-player.vx*.019,-.2,.2);
player.slip+=(ang-player.slip)*(1-Math.exp(-(drift?9:13)*dt));player.s+=player.v/3.6*dt;
if(drift&&Math.abs(player.slip)>.09){player.score+=dt*(32+Math.abs(player.slip)*170)*(player.v/260);if(Math.random()<dt*21)sparks.push({s:player.s-3,x:player.x+(Math.random()-.5)*2,v:2+Math.random()*4,life:.9})}
if(player.v>230&&Math.random()<dt*28){let sx=(rnd(Math.floor(clock*180))>.5?1:-1)*(9+6*rnd(clock*90));sparks.push({s:player.s+25+Math.random()*190,x:sx,v:3+Math.random()*6,life:.85})}
for(const p of sparks)p.life-=dt*(.85+p.v*.05);sparks=sparks.filter(p=>p.life>0).slice(-160);
trails.push({s:player.s-5,x:player.x-.91,side:0,life:1},{s:player.s-5,x:player.x+.91,side:1,life:1});for(const p of trails)p.life-=dt*(drift?.65:1.55);if(trails.length>110)trails.splice(0,trails.length-110);trails=trails.filter(p=>p.life>0);
rival.v+=(295+clamp((player.s-rival.s)*.07,-18,14)-rival.v)*dt*.7;rival.s+=rival.v/3.6*dt;rival.x=2.3*Math.sin(clock*.58)+.5*Math.cos(clock*.21);
for(const t of traffic){t.s+=t.v/3.6*dt;if(t.s<player.s-35){t.s=player.s+490+140*rnd(t.id*37+clock);t.x=[-5.1,5.1,.3][t.id-1]}}
for(const [i,t] of [rival,...traffic].entries()){const d=t.s-player.s;if(d>-.2&&d<7&&Math.abs(t.x-player.x)<1.35){player.v=Math.max(150,player.v*.78);buzz('CONTACT!')}if(d>0&&d<12&&Math.abs(t.x-player.x)<3.6&&!nearMiss.has(i)){player.score+=175;nearMiss.add(i);buzz('NEAR MISS +175')}if(d>65)nearMiss.delete(i)}
if(player.s>=2600){player.s=2600;finished=true;$('result').style.display='block';$('resultTitle').textContent=player.s>rival.s?'YOU WIN':'PHOTO FINISH';$('resultBody').textContent=`${clock.toFixed(1)} SECONDS · ${Math.round(player.score)} STYLE · RIVAL ${Math.round(rival.s-player.s)}M`}
if(flashAge>0){flashAge-=dt;if(flashAge<=0)$('flash').classList.remove('on')}if(clock>4)$('hint').style.opacity='0';updateAudio();}
function path(points,fill,stroke=null,lineWidth=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lineWidth;ctx.stroke()}}
function stroke(points,color,width=1,blur=0){ctx.save();ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';if(blur){ctx.shadowBlur=blur;ctx.shadowColor=color}ctx.stroke();ctx.restore()}
function glowRect(x,y,ww,hh,color,blur=10){ctx.save();ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=blur;ctx.fillRect(x,y,ww,hh);ctx.restore()}
function buildBackdropCache(){
 const horizon=h*(portrait?.31:.35);
 const bg=document.createElement('canvas');bg.width=Math.ceil(w);bg.height=Math.ceil(h);
 const g=bg.getContext('2d');const sky=g.createLinearGradient(0,0,0,h);
 sky.addColorStop(0,'#030617');sky.addColorStop(.34,'#141036');sky.addColorStop(.66,'#4a0b60');sky.addColorStop(1,'#0b0725');g.fillStyle=sky;g.fillRect(0,0,w,h);
 const sunX=w*(portrait?.67:.69),sunY=horizon*.72,r=Math.min(w*.105,h*.15);
 const ray=g.createRadialGradient(sunX,sunY,r*.12,sunX,sunY,r*2.7);
 ray.addColorStop(0,'#ffb48699');ray.addColorStop(.24,'#fc4cbd48');ray.addColorStop(1,'#ff46cb00');g.fillStyle=ray;g.fillRect(sunX-r*3,sunY-r*3,r*6,r*6);
 g.save();g.beginPath();g.arc(sunX,sunY,r,0,TAU);g.clip();const sd=g.createLinearGradient(0,sunY-r,0,sunY+r);
 sd.addColorStop(0,'#fff0aa');sd.addColorStop(.55,'#ff8b99');sd.addColorStop(1,'#f324b4');g.fillStyle=sd;g.fillRect(sunX-r,sunY-r,r*2,r*2);
 for(let k=0;k<8;k++){let yy=sunY+r*.10+k*k*.012*r;g.fillStyle='#160b3f';g.fillRect(sunX-r,yy,r*2,r*.027*(1+k*.8))}g.restore();
 for(let i=0;i<115;i++){const xx=rnd(i*1.71)*w,yy=rnd(i*.271)*horizon*.95,ss=.5+1.5*rnd(i*.9);g.fillStyle=i%7===0?'#ffc5f3':'#a5dfff';g.globalAlpha=.14+.4*rnd(i*.33);g.fillRect(xx,yy,ss,ss)}g.globalAlpha=1;
 skyCache=bg;
 cityLayers=[];
 for(let layer=0;layer<3;layer++){
  const cw=Math.max(1100,Math.ceil(w*1.65)),canvasLayer=document.createElement('canvas');canvasLayer.width=cw;canvasLayer.height=Math.ceil(horizon+h*.1);
  const c=canvasLayer.getContext('2d'),base=horizon+(layer-1)*h*.04;
  let i=0;for(let x=-10;x<cw;x+=38,i++){
   const bw=17+25*rnd(i*.72+layer*31),bh=(.08+.26*rnd(i*3.11+layer*29))*h*(1-layer*.18),y=base-bh;
   c.fillStyle=['#090e24','#0b1631','#10122d'][layer];c.fillRect(x,y,bw,bh);
   if(layer>0){const edge=i%3===0?'#1acfdc':'#d12fa6';c.globalAlpha=.22+layer*.12;c.fillStyle=edge;c.fillRect(x+bw-2,y,2,bh);c.globalAlpha=1;
    for(let ry=y+8;ry<base-4;ry+=11)for(let cx=x+5;cx<x+bw-3;cx+=9){const on=rnd(i*21+cx*.2+ry*.07)>.48;if(on){c.fillStyle=rnd(i*71+ry)>.50?'#45e7ef':'#b451aa';c.globalAlpha=.23+layer*.11;c.fillRect(cx,ry,2.7,3.8)}}c.globalAlpha=1;
    if(i%17===0&&layer===2){c.fillStyle=i%2?'#55eaff':'#ff43c8';c.fillRect(x+4,y+8,bw-8,3)}
   }
  }
  cityLayers.push({canvas:canvasLayer,width:cw,rate:.014+layer*.025});
 }
}
function backdrop(){
 if(!skyCache)buildBackdropCache();ctx.drawImage(skyCache,0,0);
 for(const layer of cityLayers){const shift=(player.s*layer.rate)%layer.width,first=-shift;ctx.drawImage(layer.canvas,first,0);ctx.drawImage(layer.canvas,first+layer.width,0)}
}

function projection(distance,lane=0){const z=Math.max(0,distance),p=1/(1+z/(portrait?115:105)),hz=h*(portrait?.33:compact?.32:.39),floor=h*(portrait?.82:compact?.95:.98);
let diff=road(player.s+z)-road(player.s),bend=diff*(w*.010)*(p*.85+.15);const laneUnit=w*(portrait?.034:.027)*p*3.1;
const cameraOffset=player.x*w*(portrait?.016:.013)*p;
return{x:w*.5+bend+(lane-player.x)*laneUnit-cameraOffset*.13,y:hz+(floor-hz)*p,p};}
function roadScene(){const floor=h*(portrait?.82:compact?.95:.98),near=projection(0),far=projection(700),unit=w*(portrait?.034:.027)*3.1;
// Roll road off into the distance in depth-sorted segmented ribbons.
for(let z=700;z>0;z-=9){const a=projection(z),b=projection(Math.max(0,z-9));const halfA=unit*8.3*a.p,halfB=unit*8.3*b.p;
const dark=((Math.floor((player.s+z)/32)%2)===0);path([[a.x-halfA,a.y],[a.x+halfA,a.y],[b.x+halfB,b.y],[b.x-halfB,b.y]],dark?'#11162e':'#151b36');
// High frequency chromatic edge curves with a warm secondary rail.
const stripe=(((player.s+z)/16)|0)%2===0;
for(const side of [-1,1]){let x1=a.x+side*halfA,x2=b.x+side*halfB;
path([[x1,a.y],[x1-side*unit*.39*a.p,a.y],[x2-side*unit*.39*b.p,b.y],[x2,b.y]],stripe? (side===-1?'#36faff':'#ff57d6'):'#894ad9');
if(z<240 && Math.floor((player.s+z)/15)%3===0){stroke([[x1-side*4*a.p,a.y],[x2-side*4*b.p,b.y]],side===-1?'#67ffff':'#ff8aeb',Math.max(1,5*b.p),lowFX?2:13)}
}
// Proper vanishing lane marks; dash intervals travel at road speed.

function drawExhaustTrails(cx,cy,scale){
 const S=Math.min(w,h)*(portrait?.25:.235)*scale;
 const boost=clamp((player.v-150)/245,0,1),strength=player.drifting?1.3:.85;
 ctx.save();ctx.globalCompositeOperation='screen';
 for(let side of [-1,1]){
  let startX=cx+side*S*.46, startY=cy+S*.33;
  const trailLength=(portrait?h*.17:h*.21)*(0.35+.65*boost);
  const endX=startX+side*S*(.42+boost*.60)-player.slip*S*.58;
  const endY=Math.min(h*1.14,startY+trailLength+S*.32);
  const midX=lerp(startX,endX,.45)+Math.sin(clock*14+side)*S*.08;
  const midY=lerp(startY,endY,.51);
  ctx.beginPath();ctx.moveTo(startX,startY);ctx.quadraticCurveTo(midX,midY,endX,endY);
  ctx.strokeStyle=side<0?'#ff3caa':'#43efff';ctx.lineWidth=S*.085*strength;ctx.shadowBlur=lowFX?1:S*.22;ctx.shadowColor=ctx.strokeStyle;ctx.stroke();
  ctx.strokeStyle='#e5ffff';ctx.lineWidth=Math.max(1,S*.015);ctx.shadowBlur=lowFX?0:S*.08;ctx.stroke();
  for(let j=0;j<8;j++){const t=(j/8+(clock*(1.4+boost*2))%1)%1;
   const x=lerp(startX,endX,t)+Math.sin(t*7+clock*21+side)*S*.055;
   const y=lerp(startY,endY,t);let r=S*.009*(1-t)+1;
   ctx.fillStyle=j%2?'#fff':'#7affff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=lowFX?0:S*.11;ctx.fillRect(x-r/2,y-r/2,r,r);
  }
 }
 ctx.restore();
}

function speedFX(){const m=clamp((player.v-145)/240,0,1),num=lowFX?12:45;ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<num;i++){const sign=i%2?1:-1,rr=rnd(i*3.14+Math.floor(player.s/17)),start=rr*h,xx=sign<0?rnd(i*2.5)*w*.23:w*(.77+rnd(i*1.7)*.23);let long=(5+50*m)*(.4+rnd(i+9)),col=i%4===0?'#ff83e9':'#5edfff';ctx.globalAlpha=(.08+.38*m)*rnd(i+27);stroke([[xx,start],[xx+sign*long*.15,start+long]],col,(i%5===0?2:1),lowFX?0:4)}ctx.restore();
