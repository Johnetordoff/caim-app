addEventListener('devicemotion',e=>{if(!orientSeen||performance.now()-lastSensor>180)feed(lateralMotion(e))},{passive:true});

function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,w:r.width,h:r.height}}
