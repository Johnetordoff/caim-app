const car=createVehicleState({speed:0}),keys={};let throttle=0,brake=0,steerTouch=0,thrId=null,brakeId=null,steerId=null,tilt=0,tiltTarget=0,neutral=null,asked=false;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function steering(x,w){const r=(x/w-.5)*2,m=Math.abs(r);return m<.04?0:Math.sign(r)*clamp((m-.04)/.96,0,1)}function throttleY(y,h){return clamp((h*.94-y)/(h*.36),0,1)}function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,w:r.width,h:r.height}}async function askTilt(){if(asked)return;asked=true;try{if(typeof DeviceOrientationEvent?.requestPermission==='function')await DeviceOrientationEvent.requestPermission()}catch(_){}}
